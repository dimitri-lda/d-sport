# Automatically loaded by docker compose for local development only.
x-dev: &dev
  build:
    target: dev
  environment: &dev-env
    APP_ENV: dev
    APP_DEBUG: "1"
    APP_RUNTIME_OPTIONS: '{}'
  volumes:
    - .:/app
    - backend_vendor:/app/vendor
    - backend_var:/app/var

services:
  backend:
    <<: *dev
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${HTTPS_PORT:-8443}:8443"
      - "127.0.0.1:${HTTPS_PORT:-8443}:8443/udp"
  migrate:
    <<: *dev
  worker:
    <<: *dev
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    init: true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

volumes:
  backend_vendor:
  backend_var:
  frontend_node_modules:
