framework:
    secret: '%env(APP_SECRET)%'
    handle_all_throwables: true
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_hosts: ['%env(TRUSTED_HOSTS)%']
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']
    router:
        utf8: true
    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true
    serializer:
        enabled: true
    validation:
        enabled: true
    cache:
        app: cache.adapter.redis
        default_redis_provider: app.redis_connection
    rate_limiter:
        email_verification:
            policy: fixed_window
            limit: 6
            interval: '1 minute'
        password_reset:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        registration:
            policy: fixed_window
            limit: 10
            interval: '1 hour'
        password_confirmation:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'

when@test:
    framework:
        test: true
        session:
            # Keep functional tests free of the PdoSessionHandler -> DBAL PDO
            # dependency; sessions still hit app_sessions in dev/prod.
            storage_factory_id: session.storage.factory.mock_file
