security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_USER]
    providers:
        app_users:
            id: App\Infrastructure\Security\CaseInsensitiveUserProvider
    firewalls:
        api:
            pattern: ^/api/
            provider: app_users
            json_login:
                check_path: /api/v1/auth/login
                username_path: email
                password_path: password
                success_handler: App\Presentation\Http\Security\LoginSuccessHandler
                failure_handler: App\Presentation\Http\Security\LoginFailureHandler
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: /api/v1/auth/logout
        main:
            lazy: true
            provider: app_users
